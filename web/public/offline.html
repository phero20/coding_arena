<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SlaveCode | Offline</title>
    <style>
      :root {
        /* Cyber Yellow Theme variables */
        --background: rgb(9, 9, 9);
        --foreground: rgb(251, 250, 247);
        --primary: rgb(255, 255, 255);
        --primary-foreground: rgb(9, 9, 9);
        --muted-foreground: rgb(153, 153, 153);
        --border: rgb(34, 34, 34);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background-color: var(--background);
        color: var(--foreground);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: clamp(1rem, 5vw, 2rem);
        text-align: center;
        line-height: 1.5;
      }

      ::selection {
        background: var(--primary);
        color: var(--primary-foreground);
      }

      .container {
        max-width: 450px;
        width: 100%;
        padding: 0 1rem;
      }

      /* Brand Styling */
      .brand-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(0.25rem, 3vw, 0.25rem);
        margin-bottom: 1.5rem;
        width: 100%;
        max-width: 100%;
      }

      .logo-wrapper {
        display: flex;
        align-items: center;
      }

      .logo-wrapper svg {
        width: clamp(50px, 15vw, 120px);
        height: clamp(50px, 15vw, 120px);
        color: var(--foreground);
      }

      .logo-text {
        font-size: clamp(2.25rem, 10vw, 5rem);
        font-weight: 600;
        letter-spacing: -0.03em;
        display: flex;
        align-items: center;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      p {
        color: var(--muted-foreground);
        margin-bottom: 3rem;
        font-size: 1.1rem;
      }

      button {
        background-color: var(--primary);
        color: var(--primary-foreground);
        border: none;
        padding: 1rem 2rem;
        font-size: 1rem;
        font-weight: 700;
        border-radius: 8px; /* Rounded corners */
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        box-shadow: 0 4px 12px rgba(255, 216, 31, 0.15);
      }

      button:hover {
        background-color: rgb(245, 255, 255);
        transform: translateY(-2px);
      }

      button:active {
        transform: translateY(0);
      }

      button:focus {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
    </style>
  </head>
